# Copy to .streamlit/secrets.toml for local use.
# On Streamlit Cloud: App -> Settings -> Secrets (paste the same content).

GEMINI_API_KEY = ""

# Optional
# CHAT_MODEL  = "gemini-2.5-flash"
# EMBED_MODEL = "gemini-embedding-001"
# DAILY_MSG_LIMIT = "80"

# Optional but RECOMMENDED for persistent chat history on Streamlit Cloud
# (free Supabase/Neon Postgres). Default is local SQLite, which is wiped on redeploy/reboot.
# DATABASE_URL = "postgresql://USER:PASSWORD@HOST:5432/postgres"
